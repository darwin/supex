[project]
name = "radar"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "textual>=0.80",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
