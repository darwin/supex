[project]
name = "radar"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "textual>=8.0",
    "rich>=14",
    "typer>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.3"]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.3"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
