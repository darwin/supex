[package]
name = "supex-vcad-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
# vcad evaluation pipeline (vendored git submodules)
loon-lang = { path = "../vendor/loon/crates/loon-lang" }
vcad-loon = { path = "../vendor/vcad/crates/vcad-loon" }
vcad-eval = { path = "../vendor/vcad/crates/vcad-eval" }
vcad-kernel = { path = "../vendor/vcad/crates/vcad-kernel" }
vcad-ir = { path = "../vendor/vcad/crates/vcad-ir" }
vcad-kernel-primitives = { path = "../vendor/vcad/crates/vcad-kernel-primitives" }
vcad-kernel-topo = { path = "../vendor/vcad/crates/vcad-kernel-topo" }
vcad-kernel-geom = { path = "../vendor/vcad/crates/vcad-kernel-geom" }
vcad-kernel-math = { path = "../vendor/vcad/crates/vcad-kernel-math" }
vcad-kernel-tessellate = { path = "../vendor/vcad/crates/vcad-kernel-tessellate" }

# JSON-RPC + serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
blake3 = "1"

# Temp files
tempfile = "3"

# Filesystem watching
notify = { version = "7", features = ["macos_fsevent"] }

# Signal handling
ctrlc = "3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
