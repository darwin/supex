[package]
name = "supex-vcad-viewer"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "supex_vcad_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
