name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: devtools/ci/Dockerfile
          load: true
          tags: supex-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests
        run: docker run --rm supex-test

      - name: Lint
        run: docker run --rm --entrypoint scripts/lint.sh supex-test
